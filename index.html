<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMC Capsule Slot CNC Pro</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--line:#e3e3e3;--ink:#161616;--mute:#7a7a7a}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start}
.container{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:1.1rem;font-weight:600;letter-spacing:.2px}
.sub{font-size:.8rem;color:var(--mute);margin:3px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:.75rem;margin-bottom:5px;color:var(--mute)}
input[type=number]{width:100%;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:1rem;color:var(--ink)}
input[type=number]:focus{outline:none;border-color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--mute);font-weight:600;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{width:100%;margin-top:16px;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
#errorMsg{display:none;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.8rem;text-align:center}
#loaderArea{display:none;flex-direction:column;align-items:center;padding:26px 0 6px}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.lt{font-size:.85rem;color:var(--mute)}
#resultsArea{display:none;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab-btn{flex:1;padding:9px;background:none;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--mute)}
.tab-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
canvas{display:block;width:100%;height:auto;background:#f7f7f7;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.dro{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.dro div{border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--mute);font-size:.62rem;text-transform:uppercase;letter-spacing:.4px}
.dro b{display:block;color:var(--ink);font:600 .95rem 'Courier New',monospace;text-transform:none;margin-top:1px;letter-spacing:0}
.blk{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:.78rem 'Courier New',monospace;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:#161616;height:18px;margin:2px 0}
.tm{display:flex;justify-content:space-between;color:var(--mute);font-size:.72rem;margin:2px 0 10px}
.ctrl{display:flex;gap:6px}
.ctrl button,.cp{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:600;font-size:.8rem;cursor:pointer}
.ctrl .main,.ctrl .on{background:var(--ink);border-color:var(--ink);color:#fff}
.ctrl .main{flex:2}
.ph{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-size:.8rem;font-weight:600}
.cp{flex:none;padding:5px 12px}
.code-box{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:8px 0;font:.8rem 'Courier New',monospace;overflow:auto;max-height:240px;position:relative}
.ln{padding:1px 12px;white-space:pre}
.ln.on{background:var(--ink);color:#fff}
</style>
</head>
<body>
<div class="container">
  <h1>VMC Capsule Slot Generator</h1>
  <p class="sub">Inner / Outer profile, Main + Sub program and live simulation</p>

  <div class="grid">
    <div><label>Center X (opt)</label><input type="number" id="cx" step="0.1" placeholder="0"></div>
    <div><label>Center Y (opt)</label><input type="number" id="cy" step="0.1" placeholder="0"></div>
    <div><label>Width *</label><input type="number" id="width" step="0.1" min="0.1" placeholder="e.g. 20"></div>
    <div><label>Length *</label><input type="number" id="length" step="0.1" min="0.1" placeholder="e.g. 40"></div>
    <div><label>Radius R (opt)</label><input type="number" id="radius" step="0.1" min="0" placeholder="default = Width / 2"></div>
    <div><label>Tool Dia *</label><input type="number" id="toolDia" step="0.5" min="0.1" placeholder="e.g. 8"></div>
    <div class="full"><label>Profile</label>
      <div class="seg" id="profSeg">
        <button class="on" data-p="outer" onclick="setProfile(this)">Outer</button>
        <button data-p="inner" onclick="setProfile(this)">Inner</button>
      </div>
    </div>
    <div><label>Z Depth *</label><input type="number" id="zDepth" step="0.5" placeholder="e.g. -10"></div>
    <div><label>Feed Rate *</label><input type="number" id="feed" step="10" min="10" placeholder="e.g. 500"></div>
    <div class="full"><label>Z Step per Revolution (opt, default 1) - tool spirals down while circling</label><input type="number" id="zStep" step="0.1" min="0.01" placeholder="e.g. 1"></div>
  </div>

  <div id="errorMsg"></div>
  <button id="generateBtn" class="btn" onclick="handleGenerate()">Generate G-Code</button>

  <div id="loaderArea"><div class="spinner"></div><div class="lt">Generating toolpath...</div></div>

  <div id="resultsArea">
    <div class="tabs">
      <button class="tab-btn active" id="tb-sim" onclick="switchTab('sim')">Simulation</button>
      <button class="tab-btn" id="tb-code" onclick="switchTab('code')">G-Code</button>
    </div>

    <div id="tab-sim">
      <canvas id="topCanvas" width="440" height="440"></canvas>
      <canvas id="sideCanvas" width="440" height="230"></canvas>
      <div class="dro">
        <div>X<b id="dX">0.000</b></div><div>Y<b id="dY">0.000</b></div><div>Z<b id="dZ">0.000</b></div>
        <div>Mode<b id="dMode">-</b></div><div>Comp<b id="dComp">G40</b></div><div>Feed<b id="dF">0</b></div>
        <div>Program<b id="dProg">O1000</b></div><div>Move<b id="dMove">0/0</b></div><div>Spindle<b id="dS">0</b></div>
      </div>
      <div class="blk" id="curBlock">-</div>
      <input type="range" id="seek" min="0" max="1000" value="0" oninput="seekTo(this.value)">
      <div class="tm"><span id="tNow">00:00</span><span id="tPct">0%</span><span id="tTot">00:00</span></div>
      <div class="ctrl">
        <button class="main" id="btnPlay" onclick="togglePlay()">Pause</button>
        <button onclick="restartSim()">Restart</button>
        <button onclick="endSim()">End</button>
      </div>
      <div class="ctrl" style="margin-top:6px" id="speeds">
        <button data-s="1" onclick="setSpeed(this)">1x</button>
        <button data-s="2" onclick="setSpeed(this)">2x</button>
        <button class="on" data-s="5" onclick="setSpeed(this)">5x</button>
        <button data-s="10" onclick="setSpeed(this)">10x</button>
        <button data-s="25" onclick="setSpeed(this)">25x</button>
      </div>
    </div>

    <div id="tab-code" style="display:none">
      <div class="ph">Main Program (O1000)<button class="cp" onclick="copyCode('main',this)">Copy</button></div>
      <div class="code-box" id="mainBox"></div>
      <div class="ph">Helical Sub Program (O2000)<button class="cp" onclick="copyCode('sub',this)">Copy</button></div>
      <div class="code-box" id="subBox"></div>
      <div class="ph">Finish Pass (O2001)<button class="cp" onclick="copyCode('fin',this)">Copy</button></div>
      <div class="code-box" id="finBox"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const f = v => { const t = parseFloat(v).toFixed(3); return t === '-0.000' ? '0.000' : t; };
const RAPID = 12000;
let S = null, raf = 0, profile = 'outer';

function setProfile(btn) {
  document.querySelectorAll('#profSeg button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on'); profile = btn.dataset.p;
}
function showErr(msg) { const e = $('errorMsg'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

function handleGenerate() {
  const W = +$('width').value, L = +$('length').value, T = +$('toolDia').value;
  if (!(W > 0 && L > 0 && T > 0) || $('zDepth').value === '' || !(+$('feed').value > 0)) { showErr('Please fill in all required fields (*).'); return; }
  if (L < W) { showErr('Length must be greater than or equal to Width.'); return; }
  const r = $('radius').value === '' ? W / 2 : Math.min(Math.max(+$('radius').value, 0), W / 2);
  if (profile === 'inner') {
    if (T >= W) { showErr('Inner profile: tool diameter must be smaller than the width.'); return; }
    if (T / 2 > r + 1e-9) { showErr('Inner profile: tool diameter must be at most 2 x Radius (tool cannot reach the corners).'); return; }
  }
  showErr('');
  cancelAnimationFrame(raf); S = null;
  $('resultsArea').style.display = 'none';
  const btn = $('generateBtn'); btn.disabled = true; btn.textContent = 'Processing...';
  $('loaderArea').style.display = 'flex';
  setTimeout(() => {
    $('loaderArea').style.display = 'none';
    btn.disabled = false; btn.textContent = 'Regenerate G-Code';
    processMathData();
    $('resultsArea').style.display = 'block';
    switchTab('sim');
    $('resultsArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 5000);
}

/* ---------- geometry: capsule / rounded slot, always 9 segments starting at the top apex ---------- */
function prof(cx, cy, W, L, r, ccw) {
  W = Math.max(W, 0); L = Math.max(L, 0); r = Math.max(0, Math.min(r, W / 2, L / 2));
  const hx = W / 2, hy = L / 2, P = Math.PI, h = P / 2;
  const raw = [
    { t: 'l', a: [0, hy], b: [hx - r, hy] },
    { t: 'a', c: [hx - r, hy - r], a0: h },
    { t: 'l', a: [hx, hy - r], b: [hx, -hy + r] },
    { t: 'a', c: [hx - r, -hy + r], a0: 0 },
    { t: 'l', a: [hx - r, -hy], b: [-hx + r, -hy] },
    { t: 'a', c: [-hx + r, -hy + r], a0: -h },
    { t: 'l', a: [-hx, -hy + r], b: [-hx, hy - r] },
    { t: 'a', c: [-hx + r, hy - r], a0: P },
    { t: 'l', a: [-hx + r, hy], b: [0, hy] }
  ];
  const m = ccw ? -1 : 1, X = x => cx + m * x, Y = y => cy + y;
  return raw.map(s => {
    if (s.t === 'l') return { type: 'line', start: { x: X(s.a[0]), y: Y(s.a[1]) }, end: { x: X(s.b[0]), y: Y(s.b[1]) } };
    const a0 = ccw ? P - s.a0 : s.a0, sweep = ccw ? h : -h, c = { x: X(s.c[0]), y: Y(s.c[1]) };
    return { type: 'arc', center: c, r, a0, sweep,
      start: { x: c.x + r * Math.cos(a0), y: c.y + r * Math.sin(a0) },
      end: { x: c.x + r * Math.cos(a0 + sweep), y: c.y + r * Math.sin(a0 + sweep) } };
  });
}
const degen = s => s.type === 'line' ? Math.hypot(s.end.x - s.start.x, s.end.y - s.start.y) < 1e-6 : s.r < 1e-6;

function polyline(path, steps = 12) {
  const pts = [path[0].start];
  path.forEach(s => {
    if (s.type === 'line') pts.push(s.end);
    else if (!degen(s)) for (let i = 1; i <= steps; i++) {
      const a = s.a0 + s.sweep * i / steps;
      pts.push({ x: s.center.x + s.r * Math.cos(a), y: s.center.y + s.r * Math.sin(a) });
    }
  });
  return pts;
}

/* ---------- G-code + executed motion list ---------- */
function processMathData() {
  const cx = parseFloat($('cx').value) || 0, cy = parseFloat($('cy').value) || 0;
  const W = +$('width').value, L = +$('length').value, tool = +$('toolDia').value;
  const r = $('radius').value === '' ? W / 2 : Math.min(Math.max(+$('radius').value, 0), W / 2);
  const depth = Math.abs(parseFloat($('zDepth').value) || 0);
  const stepIn = parseFloat($('zStep').value), step = stepIn > 0 ? Math.min(stepIn, depth) : Math.min(1, depth);
  const N = Math.max(1, Math.ceil(depth / step - 1e-9));       // number of helical revolutions
  const dz = Math.floor(depth / N * 1000 + 1e-9) / 1000;       // equal Z drop per revolution (never overshoots)
  const zd = -depth, trim = depth - N * dz > 0.0004;   // trim = tiny remainder taken at the start of the finish pass
  const feed = +$('feed').value, rpm = Math.floor(feed * 5) || 2500;
  const inner = profile === 'inner', ccw = inner, d = inner ? -tool / 2 : tool / 2, gArc = inner ? 'G03' : 'G02';
  const gap = tool / 2 + 5;
  const P0 = inner ? { x: cx, y: cy } : { x: cx, y: cy + L / 2 + gap + 10 };

  const tg = prof(cx, cy, W, L, r, ccw);                       // programmed contour
  const tp = prof(cx, cy, W + 2 * d, L + 2 * d, r + d, ccw);   // tool-centre path (offset by tool radius)

  // Z drop of one revolution is shared between the contour segments in proportion to their length
  const lens = tg.map(s => degen(s) ? 0 : (s.type === 'line' ? Math.hypot(s.end.x - s.start.x, s.end.y - s.start.y) : s.r * Math.PI / 2));
  const per = lens.reduce((a, b) => a + b, 0);
  const last = lens.reduce((a, l, i) => l > 0 ? i : a, 0);
  const dzs = lens.map(l => Math.round(dz * l / per * 1000) / 1000);
  dzs[last] = Math.round((dz - dzs.reduce((a, v, i) => i === last ? a : a + v, 0)) * 1000) / 1000;

  const main = [
    'O1000 (CAPSULE MAIN)', `(${inner ? 'INNER' : 'OUTER'} W=${W} L=${L} R=${f(r)} X=${cx} Y=${cy} T-DIA=${tool})`, 'G21 G90 G40 G80',
    `T01 M06 (D=${tool}MM ENDMILL)`, `G54 G00 X${f(cx)} Y${f(cy)} S${rpm} M03`, 'G43 H01 Z50.0 M08',
    '(APPROACH POS)', `G00 X${f(P0.x)} Y${f(P0.y)}`, 'Z2.0', `G01 Z0.0 F${f(feed / 2)}`,
    `G41 D01 X${f(cx)} Y${f(cy + L / 2)} F${feed}`,
    `(HELICAL RAMP - ${N} REV X Z-${f(dz)})`, `M98 P${String(N).padStart(2, '0')}2000`,
    '(FLAT FINISH PASS AT FULL DEPTH)', 'M98 P2001',
    'G00 Z2.0 (RETRACT - COMP STILL ON)', `G40 G01 X${f(P0.x)} Y${f(P0.y)}`, 'G00 Z50.0 M09', 'M30'
  ];
  const sub = [`O2000 (HELICAL REV - ${inner ? 'CCW' : 'CW'} - Z DROP ${f(dz)})`, 'G91 (INCREMENTAL)'];
  const fin = ['O2001 (FLAT FINISH PASS)', 'G90'];
  if (trim) fin.push(`G01 Z-${f(depth)}`);
  const code = [], codeF = [];
  tg.forEach((s, i) => {
    if (degen(s)) { code[i] = -1; codeF[i] = -1; return; }
    const dx = s.end.x - s.start.x, dy = s.end.y - s.start.y, zz = dzs[i] > 0 ? ` Z-${f(dzs[i])}` : '';
    if (s.type === 'line') { sub.push(`G01 X${f(dx)} Y${f(dy)}${zz}`); fin.push(`G01 X${f(s.end.x)} Y${f(s.end.y)}`); }
    else { sub.push(`${gArc} X${f(dx)} Y${f(dy)}${zz} R${f(s.r)}`); fin.push(`${gArc} X${f(s.end.x)} Y${f(s.end.y)} R${f(s.r)}`); }
    code[i] = sub.length - 1; codeF[i] = fin.length - 1;
  });
  sub.push('G90', 'M99'); fin.push('M99');

  const M = []; let cur = { x: 0, y: 0, z: 100 };
  const mv = (prog, line, type, to, arc, comp) => {
    const from = { ...cur }, t = { ...cur, ...to };
    const len = type === 'A' ? Math.hypot(arc.r * Math.PI / 2, t.z - from.z) : Math.hypot(t.x - from.x, t.y - from.y, t.z - from.z);
    const fd = type === 'R' ? RAPID : (prog === 'main' && line === 9 ? feed / 2 : feed);
    M.push({ type, prog, line, from, to: t, len, arc, comp: !!comp, feed: fd }); cur = t;
  };
  mv('main', 4, 'R', { x: cx, y: cy }); mv('main', 5, 'R', { z: 50 });
  mv('main', 7, 'R', P0); mv('main', 8, 'R', { z: 2 }); mv('main', 9, 'F', { z: 0 });
  mv('main', 10, 'F', { x: tp[0].start.x, y: tp[0].start.y }, null, true);

  // one revolution of the tool-centre path, with its share of the Z drop (shares of skipped segments carry forward)
  const rev = []; let carry = 0;
  tp.forEach((t, i) => { if (degen(t)) { carry += dzs[i]; return; } rev.push({ t, i, dz: dzs[i] + carry }); carry = 0; });
  if (carry) rev[rev.length - 1].dz += carry;
  const seg = (prog, ln, t, dzi) => {
    const z = cur.z - dzi;
    if (t.type === 'line') mv(prog, ln, 'F', { x: t.end.x, y: t.end.y, z }, null, true);
    else mv(prog, ln, 'A', { x: t.end.x, y: t.end.y, z }, { cx: t.center.x, cy: t.center.y, r: t.r, a0: t.a0, sweep: t.sweep }, true);
  };
  for (let k = 0; k < N; k++) {
    let ln = 1;   // outer corners with R=0 still need compensation arcs although no arc is programmed
    rev.forEach(o => { ln = code[o.i] >= 0 ? code[o.i] : ln; seg('sub', ln, o.t, o.dz); });
  }
  if (trim) mv('fin', 2, 'F', { z: -depth }, null, true);
  let lf = trim ? 2 : 1;
  rev.forEach(o => { lf = codeF[o.i] >= 0 ? codeF[o.i] : lf; seg('fin', lf, o.t, 0); });
  mv('main', 15, 'R', { z: 2 });
  mv('main', 16, 'F', P0, null, false);
  mv('main', 17, 'R', { z: 50 });

  let tt = 0;
  M.forEach(s => { s.t0 = tt; tt += s.len / s.feed * 60; s.t1 = tt; });

  // stock: outer = capsule + 1 mm allowance (bar), inner = plate around the slot
  const half = (Math.max(W, L) / 2 + tool + 18);
  const sc = 440 / (2 * half);
  const sh = inner ? { x: W / 2 + tool + 10, y: L / 2 + tool + 10, r: 3 } : { x: W / 2 + 1, y: L / 2 + 1, r: r + 1 };
  S = { cx, cy, W, L, tool, zd, rpm, feed, inner, half, sc, sh, moves: M, lines: { main, sub, fin }, total: tt,
        hex: polyline(tg), path: polyline(tp), NC: 300, prof: new Float32Array(300),
        speed: +document.querySelector('#speeds .on').dataset.s, spin: 0, last: 0, dragT: 0 };

  fillBox('mainBox', main); fillBox('subBox', sub); fillBox('finBox', fin);
  $('tTot').textContent = fmt(tt);
  restartSim();
  raf = requestAnimationFrame(frame);
}

function fillBox(id, lines) {
  const b = $(id); b.innerHTML = '';
  lines.forEach(l => { const d = document.createElement('div'); d.className = 'ln'; d.textContent = l || ' '; b.appendChild(d); });
}

/* ---------- simulation core ---------- */
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function stockPath(g) { const { sh, sc } = S; rr(g, 220 - sh.x * sc, 220 - sh.y * sc, 2 * sh.x * sc, 2 * sh.y * sc, sh.r * sc); }

function newStock() {
  const c = document.createElement('canvas'); c.width = c.height = 440;
  const g = c.getContext('2d');
  stockPath(g); g.clip();   // cuts only ever paint inside the stock
  g.fillStyle = '#d6d6d6'; g.fillRect(0, 0, 440, 440);
  S.stock = c; S.sctx = g; S.prof.fill(0);
}

const lerp = (a, b, k) => a + (b - a) * k;
function pos(s, k) {
  if (s.type === 'A') { const a = s.arc.a0 + s.arc.sweep * k; return { x: s.arc.cx + s.arc.r * Math.cos(a), y: s.arc.cy + s.arc.r * Math.sin(a), z: lerp(s.from.z, s.to.z, k) }; }
  return { x: lerp(s.from.x, s.to.x, k), y: lerp(s.from.y, s.to.y, k), z: lerp(s.from.z, s.to.z, k) };
}

function cut(x, y, z) {
  const { sc, half, NC, cx, cy, tool, zd } = S, cr = tool / 2, d = -z;
  S.sctx.fillStyle = `hsl(0,0%,${82 - 50 * Math.min(1, d / Math.abs(zd || 1))}%)`;
  S.sctx.beginPath(); S.sctx.arc(220 + (x - cx) * sc, 220 - (y - cy) * sc, cr * sc, 0, 7); S.sctx.fill();
  // section along X at Y = centre
  const w = 2 * half / NC;
  for (let j = 0; j < NC; j++) {
    const xm = cx - half + (j + .5) * w, dx = xm - x, dy = cy - y;
    if (dx * dx + dy * dy <= cr * cr && d > S.prof[j]) S.prof[j] = d;
  }
}

function applySeg(s, k0, k1) {
  if (s.type === 'R' || k1 <= k0) return;
  const step = Math.max(S.tool / 8, .05), n = Math.max(1, Math.ceil(s.len * (k1 - k0) / step));
  for (let i = 1; i <= n; i++) { const q = pos(s, lerp(k0, k1, i / n)); if (q.z < 0) cut(q.x, q.y, q.z); }
}

function advance(t) {
  const M = S.moves;
  while (S.ptr < M.length && M[S.ptr].t1 <= t) { applySeg(M[S.ptr], S.frac, 1); S.ptr++; S.frac = 0; }
  if (S.ptr < M.length) {
    const m = M[S.ptr], k = m.t1 > m.t0 ? (t - m.t0) / (m.t1 - m.t0) : 1;
    applySeg(m, S.frac, k); S.frac = k;
  }
}

function frame(ts) {
  if (!S) return;
  const dt = S.last ? Math.min((ts - S.last) / 1000, .1) : 0; S.last = ts;
  if (S.playing) {
    S.simT = Math.min(S.total, S.simT + dt * S.speed);
    advance(S.simT); S.spin += dt * 14;
    if (S.simT >= S.total) { S.playing = false; $('btnPlay').textContent = 'Replay'; }
  }
  render();
  raf = requestAnimationFrame(frame);
}
